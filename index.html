<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nordic Konferenz Frankfurt 2026 Delegate Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="google" content="notranslate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;500;700&family=Open+Sans:wght@400;700&display=swap">
<style id="hb-style">
/* Layout: Nordic Blue event card as the header (white logos, Copenhagen in the event pink with the ring graphic), white paper below, tint boxes and dotted blue rules. Nordic theme from the Nordic Group design system; single light look, as the brand prints on white. */
:root{
  --paper:#ffffff; --ink:#0d0d0d; --muted:#545454; --headline:#00769f; --on-brand:#ffffff;
  --tint-10:#e6f1f5; --tint-25:#bfdde7; --tint-40:#99c8d9; --tint-60:#66adc5; --tint-85:#268bad;
  --grey-10:#e6e6e6; --offer:#f28e5b; --cph-teal:#00b2a3; --cph-pink:#f07d80;
  --map-land:#eef4f6; --map-water:#bfdde7; --map-green:#d6eae6; --map-block:#dcebf0; --map-rail:#d3dbde; --map-road:#ffffff;
  --font-display:Outfit,sans-serif;
  --font-body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--headline)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.2;color:var(--headline)}
a{color:var(--headline)}
:focus-visible{outline:2px solid var(--headline);outline-offset:2px;border-radius:4px}
b,strong{font-weight:700}

/* Header: the event card */
.band{background:var(--headline);color:var(--on-brand);position:relative;overflow:hidden}
.band .band-top{padding-block:20px 0;padding-bottom:0}
.band .band-meta{padding-block:0 24px;display:flex;flex-direction:column;gap:14px}
.lockup-h{margin:22px 0 20px;line-height:0}
.lockup-img{display:block;width:clamp(300px,62vw,640px);max-width:100%;height:auto}
.foot-lockup{display:block;width:220px;max-width:100%;height:auto;margin-bottom:6px}
.logos{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logos img{display:block;height:auto}
.logos .nl{width:64px}
.logos .dl{width:96px}
.logos .tag{margin-left:auto}
.tag{display:inline-block;font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--on-brand);color:var(--headline)}
.tag.staff{background:var(--cph-pink);color:var(--ink)}
.band h1{color:var(--on-brand);font-size:clamp(34px,7vw,56px);line-height:1.08;display:flex;flex-direction:column}
.band h1 .t{font-weight:100}
.band .meta{display:flex;flex-wrap:wrap;gap:4px 22px;font-family:var(--font-display);font-weight:300;font-size:18px}
.band .meta b{font-weight:500}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--tint-25)}
nav.tabs .rail{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .rail::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:14px 12px 11px;text-decoration:none;color:var(--muted);font-family:var(--font-display);font-weight:500;font-size:16px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--headline);border-bottom-color:var(--headline)}
nav.tabs a:hover{color:var(--headline)}

main .wrap{padding-block:30px 48px;display:flex;flex-direction:column;gap:32px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-family:var(--font-display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--headline);font-weight:700}
h2{font-size:clamp(26px,4.5vw,32px);font-weight:500}
h2 b{font-weight:500}
h3{font-size:19px;font-weight:500}
p{margin:0;max-width:65ch}
.lede{font-family:var(--font-display);font-weight:300;font-size:22px;line-height:1.4;color:var(--headline);max-width:none}
.lede + .muted{max-width:none}
.muted{color:var(--muted)}

/* Page-title lockup: thin line over medium line, blue rule down the left */
.lockup{border-left:2px solid var(--headline);padding-left:14px;display:flex;flex-direction:column}
.lockup .l1{font-family:var(--font-display);font-weight:300;font-size:clamp(26px,4.5vw,34px);line-height:1.15;color:var(--headline)}
.lockup .l2{font-family:var(--font-display);font-weight:500;font-size:clamp(26px,4.5vw,34px);line-height:1.15;color:var(--headline)}

.panel{background:var(--tint-10);border-radius:8px;padding:18px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.fact{display:flex;flex-direction:column;gap:2px}
.fact .k{font-family:var(--font-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--headline);font-weight:700}
.fact .v{font-family:var(--font-display);font-weight:500;font-size:22px;color:var(--ink)}
.fact .s{color:var(--muted);font-size:15px}

.countdown{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;border-radius:8px;background:var(--headline);color:var(--on-brand);font-family:var(--font-display);font-weight:300;font-size:18px}
.countdown b{font-size:34px;font-weight:500;color:var(--on-brand)}
.countdown a{color:var(--on-brand)}

.times{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.times > div{display:flex;flex-direction:column;gap:2px;padding:4px 0 4px 14px;border-left:2px solid var(--tint-40)}
.times .d{font-family:var(--font-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--headline);font-weight:700}
.times .t{font-family:var(--font-display);font-weight:100;font-size:40px;line-height:1.1;color:var(--headline);font-variant-numeric:tabular-nums}
.times > div.hot{border-left-color:var(--headline)}
.times > div.hot .t{font-weight:500}

/* Programme */
.days{display:flex;gap:8px;flex-wrap:wrap}
.days button{font:inherit;cursor:pointer;border:1.5px solid var(--headline);background:var(--paper);color:var(--headline);padding:8px 18px;border-radius:999px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;font-family:var(--font-display);font-weight:500;font-size:17px}
.days button small{font-weight:300;font-size:14px}
.days button[aria-pressed="true"]{background:var(--headline);color:var(--on-brand)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:baseline;gap:8px;padding:7px 14px;border-radius:999px;background:var(--tint-10);color:var(--headline);font-family:var(--font-display);font-weight:500;font-size:15px}
.pill .t{font-weight:700}
.pill.hot{background:var(--headline);color:var(--on-brand)}
.tt{list-style:none;margin:0;padding:0}
.tt li{display:grid;grid-template-columns:70px 1fr;gap:16px;padding:13px 4px;border-top:1.5px dotted var(--tint-60);position:relative}
.tt li:last-child{border-bottom:1.5px dotted var(--tint-60)}
.tt .time{font-family:var(--font-display);font-weight:500;font-size:18px;color:var(--headline);font-variant-numeric:tabular-nums;line-height:1.35}
.tt .what{min-width:0;display:flex;flex-direction:column;gap:2px}
.tt .title{font-weight:700}
.tt .who{color:var(--muted);font-size:15px}
.tt li.soft{background:var(--tint-10)}
.tt li.soft .title{font-weight:400}
.tt li.social{background:var(--tint-25)}
.tt li.now{box-shadow:inset 4px 0 0 var(--cph-pink);padding-left:14px}
.flag{display:inline-block;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:2px}
.flag.now{background:var(--cph-pink);color:var(--ink)}
.flag.next{background:var(--headline);color:var(--on-brand)}
.tbc{display:inline-block;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--grey-10);color:var(--ink)}
.notes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.note{display:flex;flex-direction:column;gap:6px}
.note.hot{background:var(--headline);color:var(--on-brand)}
.note.hot h3{color:var(--on-brand)}
.change{font-size:14px;color:var(--muted)}

/* Journey */
.journey{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.stop{flex:1 1 0;min-width:96px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:14px clamp(10px,1.4vw,16px);background:var(--headline);color:var(--on-brand);border-radius:8px 8px 8px 0}
.stop b{font-family:var(--font-display);font-weight:500;font-size:clamp(13px,1.7vw,17px);hyphens:none;-webkit-hyphens:none;line-height:1.2}
.stop span{font-size:clamp(11px,1.35vw,13px);opacity:.9;hyphens:none;-webkit-hyphens:none;line-height:1.3}
.leg{flex:0 1 auto;max-width:104px;hyphens:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;color:var(--headline);font-family:var(--font-display);font-size:clamp(12px,1.5vw,14px);font-weight:500;text-align:center;line-height:1.25}
.leg i{font-style:normal;font-size:20px}
.leg span{font-weight:300}
ol.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--headline);color:var(--on-brand);font-family:var(--font-display);font-weight:500;font-size:14px;display:grid;place-items:center}
.map{background:var(--paper);border:1px solid var(--tint-25);border-radius:8px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.mapfoot{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 16px;background:var(--tint-10);font-size:15px}
.hotel{display:flex;flex-direction:column;gap:6px}
.hotel .who{font-family:var(--font-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--headline)}
.btnlink{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--headline)}
.btnlink:hover{text-decoration:underline}

/* Tables */
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:11px 12px;border-top:1.5px dotted var(--tint-60);vertical-align:top}
tbody tr:last-child td{border-bottom:1.5px dotted var(--tint-60)}
thead th{border-top:0;font-family:var(--font-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-brand);font-weight:700;background:var(--headline)}
thead th:first-child{border-radius:8px 0 0 0}
thead th:last-child{border-radius:0 8px 0 0}
td.whom{white-space:nowrap}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--tint-10);color:var(--headline);font-family:var(--font-display);font-weight:500;font-size:15px;margin:0 4px 4px 0;cursor:pointer;border:0}
.chip:hover{background:var(--tint-25)}

/* Team */
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.person{display:flex;flex-direction:column;gap:12px}
.person.sel{box-shadow:0 0 0 2px var(--headline)}
.person header{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50% 50% 50% 0;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:500;font-size:20px;background:var(--headline);color:var(--on-brand)}
.person h3{color:var(--ink)}
.person ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.person li{display:flex;flex-direction:column;font-size:15px;border-left:2px solid var(--tint-40);padding-left:10px}
.person li span{color:var(--muted);font-size:13px}
.person li.thu{border-left-color:var(--headline)}

/* Contacts */
.contact{display:flex;flex-direction:column;gap:8px}
.contact .role{color:var(--muted);font-size:15px}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.line code{font-family:var(--font-body);font-weight:700;font-size:16px;user-select:all;overflow-wrap:anywhere}
.copy{font:inherit;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--tint-60);background:var(--paper);color:var(--headline);padding:2px 9px;border-radius:999px}
.copy:hover{background:var(--tint-25)}
.sos{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:20px;border-radius:8px;background:var(--headline);color:var(--on-brand)}
.sos b{font-family:var(--font-display);font-size:56px;font-weight:500;line-height:1;width:96px;height:96px;border-radius:50%;background:var(--on-brand);color:var(--headline);display:grid;place-items:center;font-size:36px;flex:none}
.sos h3{color:var(--on-brand)}

footer.foot{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px;border-top:1.5px dotted var(--tint-60);padding-top:16px}
footer.foot .sites{color:var(--headline);font-weight:700}
@media (prefers-reduced-motion:no-preference){[data-view]{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (max-width:560px){
  .tt li{grid-template-columns:54px 1fr;gap:10px}
  .tt .time{font-size:16px}
}

/* Editing */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.editbar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.editbar .msg{flex:1 1 220px;font-size:15px}
.editbar button,.editbtn{font-family:var(--font-display);font-weight:500;font-size:15px;cursor:pointer;border-radius:999px;padding:7px 16px;border:1.5px solid var(--paper);background:transparent;color:var(--paper)}
.editbar button.primary{background:var(--paper);color:var(--ink)}
.editbar button:disabled{opacity:.5;cursor:default}
.editbtn{border-color:var(--on-brand);color:var(--on-brand)}
.edbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dlmsg{font-size:14px}
.editbtn:hover{background:var(--on-brand);color:var(--headline)}
body.editing main .wrap{padding-bottom:110px}
.ed{outline:1.5px dashed var(--tint-60);outline-offset:2px;border-radius:3px;min-width:1.5em;display:inline-block;white-space:pre-wrap;cursor:text}
.ed:hover{background:rgba(0,118,159,.06)}
.ed:focus{outline:2px solid var(--headline);background:var(--paper);color:var(--ink)}
.ed:empty::before{content:"Empty";color:var(--muted);font-style:italic}
.edadd{font-family:var(--font-display);font-weight:500;font-size:14px;cursor:pointer;border:1.5px dashed var(--headline);background:var(--paper);color:var(--headline);border-radius:999px;padding:5px 14px;align-self:flex-start}
.edadd:hover{background:var(--tint-10)}
.edx{font:inherit;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--tint-60);background:var(--paper);color:var(--headline);border-radius:999px;width:24px;height:24px;line-height:1;padding:0;flex:none}
.edx:hover{background:var(--headline);border-color:var(--headline);color:var(--on-brand)}
.edtype{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid var(--tint-60);background:var(--paper);color:var(--headline);border-radius:999px;padding:2px 9px}
.edrow{display:flex;align-items:flex-start;gap:8px}
.edrow > :first-child{flex:1;min-width:0}
.edhint{background:var(--tint-10);border-radius:8px;padding:12px 16px;font-size:15px}
.note.hot .ed:focus{color:var(--ink)}
.countdown .ed:focus,.stop .ed:focus,.sos .ed:focus{color:var(--ink)}

/* Theme line under the conference logo */
.band .theme{margin:0;max-width:640px;font-family:var(--font-display);font-weight:300;font-size:clamp(19px,3vw,24px);line-height:1.3;color:var(--on-brand)}
.band .theme .ed:focus{color:var(--ink)}

/* Speakers */
.speakers{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.speaker{display:flex;flex-direction:column;gap:12px}
.sp-head{display:flex;gap:14px;align-items:center}
.sp-photo{width:76px;height:76px;flex:none;object-fit:cover;border-radius:50% 50% 50% 0;background:var(--tint-25)}
.sp-initial{display:grid;place-items:center;font-family:var(--font-display);font-weight:500;font-size:30px;color:var(--headline)}
.sp-id{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.sp-id h3{color:var(--ink)}
.sp-creds{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--headline)}
.sp-role{font-size:14px;color:var(--muted)}
.sp-sess{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;border-top:1.5px dotted var(--tint-60);padding-top:10px}
.sp-sess li{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:14px}
.sp-when{font-family:var(--font-display);font-weight:500;color:var(--headline);font-variant-numeric:tabular-nums}

/* Language switch */
.langsw{display:inline-flex;border:1.5px solid var(--on-brand);border-radius:999px;overflow:hidden;margin-left:10px}
.langsw button{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.08em;padding:5px 11px;border:0;background:transparent;color:var(--on-brand);cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--on-brand);color:var(--headline)}

@media (max-width:820px){
  .journey{flex-direction:column;overflow-x:visible;align-items:center}
  .stop{flex:none;min-width:0;width:min(100%,320px);align-items:center;text-align:center}
  .leg{flex-direction:row;justify-content:center;align-items:baseline;gap:8px;padding:8px 0;text-align:center;max-width:none;font-size:15px;white-space:nowrap}
  .leg span{white-space:normal}
  .stop b{font-size:17px}
  .stop span{font-size:13px}
  .stop{padding:12px 16px}
  .leg i{transform:rotate(90deg)}
  .leg br{display:none}
}
@media (max-width:480px){
  .logos{flex-wrap:nowrap;gap:10px}
  .logos .nl{width:52px}
  .tag{font-size:11px;padding:4px 9px;letter-spacing:.06em}
  .langsw{margin-left:6px}
  .langsw button{padding:4px 8px;font-size:12px}
}

/* Responsive maps: a bolder version on small screens */
.map .m-narrow{display:none}
.maplegend{flex-direction:column;gap:6px;padding:10px 16px;font-size:14px;border-top:1px solid var(--tint-25)}
.maplegend span{display:flex;align-items:center;gap:10px}
.lg-dot{width:34px;height:0;border-top:5px dotted var(--headline)}
.lg-dash{width:34px;height:0;border-top:4px dashed var(--cph-pink)}
.lg-ink{width:34px;height:0;border-top:3px dashed var(--ink)}
@media (max-width:620px){
  .map svg.m-wide{display:none}
  .map svg.m-narrow{display:block}
  .map .maplegend{display:flex}
}

.rsvp{display:flex;align-items:center;justify-content:space-between;gap:20px 32px;flex-wrap:wrap;padding:22px 24px;border-radius:8px;border:3px solid var(--headline);background:var(--tint-10, #e6f1f5)}
.rsvp-txt{flex:1 1 320px;display:flex;flex-direction:column;gap:6px}
.rsvp h2{margin:0;color:var(--headline);font-size:clamp(22px,4vw,28px)}
.rsvp p{margin:0;font-size:17px}
.rsvp .rsvp-dl{font-weight:700;color:var(--ink)}
.rsvp-btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;background:var(--headline);color:var(--on-brand);font-family:var(--font-display);font-weight:500;font-size:18px;text-decoration:none;white-space:nowrap}
.rsvp-btn:hover{filter:brightness(1.1)}
.dayhead + .rsvp{margin:4px 0 20px}
@media (max-width:480px){.rsvp-btn{width:100%;white-space:normal;text-align:center}}
.rsvp-after{border-width:0 0 0 4px;border-radius:0 8px 8px 0;padding:16px 20px}
.rsvp-after h2{font-size:clamp(20px,3.5vw,24px)}
.rsvp + .rsvp-after{margin-top:12px}

.res-h{margin-bottom:4px}

ört Chris Moore zu den Pionieren, die fortschrittliche funktionelle Labordiagnostik für Practitioner in Europa zugänglich gemacht haben. Sein Vortrag beleuchtet die Entwicklung der Funktionellen Medizin, die zunehmende Bedeutung von Präzisionsdiagnostik und Systembiologie sowie die zentrale Rolle von Laboranalysen bei der ursachenorientierten Medizin."}, {"key": "boeckelmann", "match": "Boeckelmann", "name": "Dr. Astrid Boeckelmann", "creds": "ND, M.Sc., Dipl. Biol.", "role": "Funktionelle Medizin, Hormonmedizin & klinische Labordiagnostik", "bio": "Dr. Astrid Boeckelmann wird den Zusammenhang zwischen Darmgesundheit, Mikrobiom und Autoimmunität anhand von GI-MAP und DNA Gut beleuchten. Anhand klinischer Fallbeispiele zeigt sie, wie Darmfunktion, Mikrobiom und genetische Prädispositionen zur Immunregulation beitragen. In einem zweiten Vortrag wird sie die hormonellen Veränderungen der Perimenopause mithilfe moderner funktioneller Diagnostik erklären. Der Vortrag zeigt, wie DUTCH Cycle Mapping und DUTCH Complete hormonelle Veränderungen sichtbar machen, die in konventionellen Testverfahren häufig verborgen bleiben."}, {"key": "eerden", "match": "van der Eerden", "name": "Corinna van der Eerden", "creds": "AFMCP", "role": "Functional Medicine Practitioner (AFMCP), Clinical Education Specialist (SAFM), Head Educator (HealVersity)", "bio": "Corinna van der Eerden wird den DNA-Gut-Test und seine klinische Anwendung in der Funktionellen Medizin vorstellen. Der Vortrag zeigt, wie genetische Variationen Verdauung, Darmbarriere, Histaminstoffwechsel, Immunfunktion und Entzündungsregulation beeinflussen können. Darüber hinaus wird beleuchtet, wie genetische Prädispositionen mit Darmbarriere-Störungen und chronischen Entzündungsprozessen zusammenhängen können und welche Bedeutung dies für die Darm-Hirn-Achse hat."}, {"key": "engels", "match": "Engels", "name": "Patrick Engels", "creds": "", "role": "Fachkraft für klinische und pädagogische Unterstützung, Nordic Laboratories", "bio": "Patrick Engels wird praxisnahe Strategien zur Unterstützung der Darmbarriere und mikrobiellen Gesundheit vorstellen und zeigen, wie die Integrität der Darmschleimhaut wiederhergestellt, verbessert und langfristig geschützt werden kann. Sein zweiter Vortrag konzentriert sich auf die Entgiftung von Hormonen, Hormonmetaboliten und hormonähnlichen Umweltstoffen. Teilnehmer lernen, welche Mikronährstoffe und therapeutischen Ansätze sich für unterschiedliche klinische Zielsetzungen eignen."}, {"key": "auer", "match": "Auer", "name": "Daniel Auer", "creds": "IFMCP", "role": "Doctor of Chiropractic (USA), Functional Medicine Practitioner (IFMCP), Neurofeedback-Therapeut", "bio": "Daniel Auer wird zeigen, wie komplexe neurologische und systemische Beschwerden mithilfe funktioneller Diagnostik und funktioneller Neurologie entschlüsselt werden können. Anhand einer umfassenden Fallstudie eines Patienten mit über 30 Jahren therapieresistenter Epilepsie beleuchtet der Vortrag die Wechselwirkungen zwischen Darm-Hirn-Achse, Neuroinflammation, Mikroglia-Priming, chronischer Immundysregulation und einer erhöhten Permeabilität der Blut-Hirn-Schranke (Leaky Brain)."}, {"key": "meschede", "match": "Meschede", "name": "Dr. Carl-Peter Meschede", "creds": "MHBA", "role": "Facharzt für Orthopädie, Regenerative Medizin & Longevity Medicine", "bio": "Dr. Carl-Peter Meschede wird einen Paradigmenwechsel in der Orthopädie vorstellen und Arthrose als systemische Entzündungserkrankung betrachten. Im Mittelpunkt steht das Konzept des Inflammaging – chronische unterschwellige Entzündungen, die durch oxidativen Stress, mitochondriale Dysfunktion und zelluläre Seneszenz zur Degeneration von Gelenken und Bandscheiben beitragen. Darüber hinaus wird die Rolle regenerativer Verfahren wie PRP im Kontext einer ganzheitlichen Orthopädie beleuchtet."}, {"key": "frobel", "match": "Frobel", "name": "Andschana Frobel", "creds": "", "role": "Expertin für funktionelle Genetik, Hormonstoffwechsel & Bindege as the full programme, all the speakers, and everything practical you need for your visit.", "welcomeContact": "Any questions before you travel? Email us at {perheide@nordicgroup.eu|mailto:perheide@nordicgroup.eu} or {events@nordicgroup.eu|mailto:events@nordicgroup.eu}.", "glance": [{"k": "When", "v": "Sat 7 – Sun 8 Nov", "s": "Two days of talks and case studies"}, {"k": "Where", "v": "Radisson Blu Hotel", "s": "Franklinstraße 65, Frankfurt am Main · Lecture room: Wallstreet 1-3"}, {"k": "Speakers", "v": "8 experts", "s": "Functional medicine and diagnostics"}, {"k": "Included", "v": "Lunch and breaks", "s": "Both days, with our Nordic Smoothie"}], "keyTimes": [{"d": "Saturday", "t": "08:30", "s": "Registration · welcome at 09:00"}, {"d": "Saturday", "t": "18:00", "s": "Close of day 1"}, {"d": "Saturday", "t": "18:15", "s": "Drinks reception · Bellavino, Ohmstraße 57"}, {"d": "Sunday", "t": "08:00", "s": "Earlier start: registration from 08:00", "hot": true}, {"d": "Sunday", "t": "16:30", "s": "Conference close"}], "days": [{"id": "sat", "name": "Saturday", "date": "7 November", "iso": "2026-11-07", "eyebrow": "Day 1", "headline": {"label": "Registration opens", "t": "08:30"}, "sessions": [{"t": "08:30", "title": "Registration", "k": "soft"}, {"t": "09:00", "title": "Welcome", "who": "Chris Moore, CEO Nordic Group"}, {"t": "09:30", "title": "Barriers and Barrier Integrity: The Gut-Brain Axis, the Role of LPS & Histamine, and an Introduction to DNA Gut", "who": "Corinna van der Eerden"}, {"t": "10:30", "title": "Break – Nordic Smoothie", "k": "soft"}, {"t": "11:00", "title": "Everything Begins in the Gut – Insights from GI-MAP and DNA Gut", "who": "Dr Astrid Boeckelmann, ND"}, {"t": "12:00", "title": "Supplements for Gut Barrier Integrity, Microbial Health and Brain Health", "who": "Patrick Engels"}, {"t": "13:00", "title": "Lunch", "k": "soft"}, {"t": "14:00", "title": "Leaky Brain & Neuroinflammation: A Case Study Using Insights from OAT, GI-MAP, Neurotransmitters, DNA Gut, DNA Histamine & DNA Mind", "who": "Daniel Auer, IFMCP"}, {"t": "16:00", "title": "Break", "k": "soft"}, {"t": "16:30", "title": "Inflammaging in Orthopaedics: Regeneration Instead of Degeneration", "who": "Dr Carl-Peter Meschede"}, {"t": "18:00", "title": "Close of day 1", "k": "soft"}, {"t": "18:15 / 18:30", "title": "Drinks reception", "who": "Bellavino Vinothek, Ohmstraße 57, 60486 Frankfurt am Main – about 7 minutes on foot from the hotel", "k": "social"}], "notes": [{"h": "Nordic Smoothie", "b": "We serve our Nordic Smoothie in the morning break. Visit our stands during the breaks too."}, {"h": "Drinks reception", "b": "Day 1 ends with a drinks reception at 18:15 / 18:30 at Bellavino Vinothek (Ohmstraße 57, 60486 Frankfurt am Main), about 7 minutes on foot from the hotel."}, {"h": "Earlier start tomorrow", "hot": true, "b": "On Sunday, registration opens at 08:00 and the first talk starts at 08:30."}], "rsvp": true}, {"id": "sun", "name": "Sunday", "date": "8 November", "iso": "2026-11-08", "eyebrow": "Day 2", "headline": {"label": "Earlier start: registration from", "t": "08:00", "hot": true}, "sessions": [{"t": "08:00", "title": "Registration", "k": "soft"}, {"t": "08:30", "title": "Perimenopause & Hormone Metabolism from a Functional Medicine Perspective", "who": "Dr Astrid Boeckelmann, ND"}, {"t": "09:30", "title": "Lipoedema and Cellulite: Hidden Causes & Metabolic Optimisation – Insights from DUTCH & DNA Hormones", "who": "Andschana Frobel"}, {"t": "10:30", "title": "Break – Nordic Smoothie", "k": "soft"}, {"t": "11:00", "title": "The Genetics of Fertility", "who": "Dr Carola Kissel"}, {"t": "12:15", "title": "Lunch", "k": "soft"}, {"t": "13:15", "title": "Case Studies in Male & Female Fertility Using Insights from DUTCH, Growbaby, DNA Histamine & the Vaginal Microbiome", "who": "Dr Carola Kissel"}, {"t": "14:15", "title": "Supplements for Detoxification & Hormonal Health", "who": "Patrick Engels"}, {"t": "15:15", "title": "Break", "k": "soft"}, {"t": "15:45", "title": "Panel Discussion: Applying Functional Testing in Modern Clinical Practice", "who": "Moderated by Corinna van der Eerden"}, {"t": "16:30", "title": "Conference close", "k": "soft"}], "notes": [{"h": "Conference close", "b": "The conference ends after the panel discussion at around 16:30."}]}], "tzNote": "All times are local (CET). This is a provisional agenda and may change.", "speakers": [{"key": "moore", "match": "Chris Moore", "name": "Chris Moore", "creds": "", "role": "Founder and CEO of Nordic Group", "bio": "Chris Moore will open the conference and share his vision for the future of functional medicine and functional diagnostics in Europe. As founder of Nordic Laboratories, he is one of the pioneers who made advanced functional laboratory testing available to practitioners across Europe. His talk looks at how functional medicine has developed, the growing importance of precision diagnostics and systems biology, and the central role of lab testing in root-cause medicine."}, {"key": "boeckelmann", "match": "Boeckelmann", "name": "Dr Astrid Boeckelmann", "creds": "ND, MSc, Dipl. Biol.", "role": "Functional medicine, hormone medicine and clinical laboratory diagnostics", "bio": "Dr Astrid Boeckelmann will explore the links between gut health, the microbiome and autoimmunity using GI-MAP and DNA Gut. Through clinical cases, she shows how gut function, the microbiome and genetic predispositions contribute to immune regulation. In a second talk, she explains the hormonal changes of perimenopause using modern functional testing, showing how DUTCH Cycle Mapping and DUTCH Complete reveal changes that conventional tests often miss."}, {"key": "eerden", "match": "van der Eerden", "name": "Corinna van der Eerden", "creds": "AFMCP", "role": "Functional Medicine Practitioner (AFMCP), Clinical Education Specialist (SAFM), Head Educator (HealVersity)", "bio": "Corinna van der Eerden will present the DNA Gut test and its clinical use in functional medicine. Her talk shows how genetic variations can affect digestion, the gut barrier, histamine metabolism, immune function and inflammation, and how genetic predispositions link to gut barrier problems, chronic inflammation and the gut-brain axis."}, {"key": "engels", "match": "Engels", "name": "Patrick Engels", "creds": "", "role": "Clinical and Educational Support Specialist, Nordic Laboratories", "bio": "Patrick Engels will present practical strategies to support the gut barrier and microbial health, and show how the integrity of the gut lining can be restored, improved and protected long term. His second talk focuses on detoxifying hormones, hormone metabolites and hormone-like environmental compounds, and which micronutrients and therapeutic approaches suit different clinical goals."}, {"key": "auer", "match": "Auer", "name": "Daniel Auer", "creds": "IFMCP", "role": "Doctor of Chiropractic (USA), Functional Medicine Practitioner (IFMCP), Neurofeedback Therapist", "bio": "Daniel Auer will show how complex neurological and systemic conditions can be unravelled using functional testing and functional neurology. Through an in-depth case study of a patient with more than 30 years of treatment-resistant epilepsy, he explores the interplay between the gut-brain axis, neuroinflammation, microglial priming, chronic immune dysregulation and increased blood-brain barrier permeability (leaky brain)."}, {"key": "meschede", "match": "Meschede", "name": "Dr Carl-Peter Meschede", "creds": "MHBA", "role": "Specialist in Orthopaedics, Regenerative Medicine and Longevity Medicine", "bio": "Dr Carl-Peter Meschede will present a paradigm shift in orthopaedics, looking at osteoarthritis as a systemic inflammatory condition. The focus is inflammaging: chronic low-grade inflammation driven by oxidative stress, mitochondrial dysfunction and cellular senescence that contributes to the degeneration of joints and spinal discs. He also covers regenerative treatments such as PRP within a whole-person approach to orthopaedics."}, {"key": "frobel", "match": "Frobel", "name": "Andschana Frobel", "creds": "", "role": "Expert in functional genetics, hormone metabolism and connective tissue health", "bio": "Andschana Frobel will explore the functional causes of lipoedema, cellulite and connective tissue weakness from a genetic and hormonal perspective. Her talk shows how genetic predisposition, inflammation, hormone metabolism, methylation and detoxification together affect tissue quality, and uses DUTCH and DNA Health results to identify and address individual patterns."}, {"key": "kissel", "match": "Kissel", "name": "Dr Carola Kissel", "creds": "MSc", "role": "Master of Science in Nutrition and Integrative Health, Certified Women’s Health Coach and HeartMath Practitioner", "bio": "Dr Carola Kissel will explore the genetic and functional factors that affect fertility and pregnancy, including genetic polymorphisms that influence egg quality, sperm quality, fertilisation, implantation and maintaining a pregnancy. Using DUTCH, DNA Health, Growbaby, GI-MAP and vaginal microbiome testing, she shows the links between egg quality, implantation, early pregnancy and sperm health."}], "travel": {"intro": "There are three good ways from the airport to the Radisson Blu. A taxi is the simplest. By public transport, the S-Bahn plus tram gives you the shortest walk.", "journey": [{"b": "FRA Airport", "s": "Regional train station"}, {"leg": "S8 / S9", "s": "to Hauptbahnhof"}, {"b": "Hauptbahnhof", "s": "Change"}, {"leg": "Tram 17", "s": "to An der Dammheide"}, {"b": "An der Dammheide", "s": "Tram stop"}, {"leg": "Walk", "s": "about 4 min"}, {"b": "Radisson Blu", "s": "Franklinstraße 65"}], "mapLinks": [{"label": "Radisson Blu", "q": "Radisson Blu Hotel Frankfurt, Franklinstraße 65, Frankfurt am Main"}, {"label": "An der Dammheide", "q": "Haltestelle An der Dammheide, Frankfurt am Main"}, {"label": "Frankfurt (Main) West", "q": "Bahnhof Frankfurt (Main) West"}, {"label": "Bellavino", "q": "Bellavino Vinothek, Ohmstraße 57, 60486 Frankfurt am Main"}], "from": ["Simplest: a taxi from the airport, about 13–15 minutes via the A5, depending on traffic.", "By S-Bahn and tram: S8 or S9 to Hauptbahnhof (main station), then tram 17 to \"An der Dammheide\". From there it is about 4 minutes on foot via Franklinstraße and Voltastraße.", "By S-Bahn only: S8 to Hauptbahnhof, then the S3, S4, S5 or S6 to Frankfurt (Main) West (3 stops). From there it is about 1 km on foot, around 14 minutes.", "By car: the hotel has an underground car park. Parking costs €28 per car, per day."], "home": ["Taxi to the airport: about 13–15 minutes via the A5, depending on traffic.", "Or tram 17 from \"An der Dammheide\" to Hauptbahnhof, then the S8 or S9 to the airport.", "Or walk to Frankfurt (Main) West S-Bahn station (about 1 km), take the S3, S4, S5 or S6 to Hauptbahnhof, then the S8 or S9 to the airport.", "By public transport, allow about an hour to the terminal, plus check-in. [CHECK TIMES IN THE RMV PLANNER]"], "hotelsTitle": "Venue", "hotels": [{"who": "Venue", "name": "Radisson Blu Hotel Frankfurt", "addr": "Franklinstraße 65, Frankfurt am Main", "s": "All talks take place here. Lecture room: Wallstreet 1-3. Parking: underground car park at the hotel, €28 per car, per day.", "q": "Radisson Blu Hotel Frankfurt, Franklinstraße 65, Frankfurt am Main"}]}, "practicalIntro": "A few things worth knowing before you arrive.", "practical": [{"h": "Registration", "b": "Collect your name badge at the registration desk when you arrive and please wear it on both days."}, {"h": "Food and drink", "b": "Lunch and breaks with our Nordic Smoothie are included on both days."}, {"h": "Programme", "b": "This is a provisional agenda and may change."}, {"h": "Wi-Fi", "b": "Free Wi-Fi on the \"Radisson Rewards\" network. No password needed."}, {"h": "Weather", "b": "Usually around 4–11 °C in early November, and often wet. Bring a warm coat and an umbrella."}], "sosNote": "Free from a const tx = s => esc(s).replace(/\[([^\]]+)\]/g, (_, m) => `<span class="tbc" title="${m}">${U('To confirm')}</span>`)
  .replace(/\{([^|{}]+)\|((?:mailto:|https?:\/\/)[^}\s]+)\}/g, (_, t, u) => `<a href="${u}"${u.startsWith('http')?' target="_blank" rel="noopener"':''}>${t}</a>` + (u === 'mailto:'+t ? `<button type="button" class="copy copyic inl" data-copy="${t}" aria-label="${U('Copy')} ${t}">${COPYIC}<span class="cl">${U('Copy')}</span></button>` : ''));

function cphNow(){
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:(D.tz||'Europe/Copenhagen'),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;

let tabs = D.tabs;
const tabsEl = document.getElementById('tabs');
const drawTabs = () => { tabs = D.tabs; tabsEl.innerHTML = tabs.map(t=>`<a href="#${t.id}" data-tab="${t.id}">${esc(t.label)}</a>`).join(''); };
drawTabs();

let selDay = null, selPerson = null;

// ---------- Views ----------
const V = {};
const note = (p, i) => `<div class="panel note ${get(p+'.'+i+'.hot')?'hot':''}"><div class="edrow"><h3>${T(`${p}.${i}.h`)}</h3>${DEL(`${p}.${i}`)}</div><p>${T(`${p}.${i}.b`)}</p></div>`;
const notes = (p, label='Add a note') => `<div class="notes">${(get(p)||[]).map((_,i)=>note(p,i)).join('')}</div>${ADD(p,label)}`;

const rsvp = () => {
  if (!D.rsvp) return '';
  const d = cphNow().date, open = editing || !D.rsvp.until || d < D.rsvp.until;
  const btn = editing ? `<span class="rsvp-btn">${T('rsvp.btn')}</span><span class="muted">Email link: ${T('rsvp.href')}</span>` : `<div class="rsvp-act"><a class="rsvp-btn" href="${esc(D.rsvp.href)}">${esc(D.rsvp.btn)} →</a>${D.rsvp.email?`<div class="rsvp-copy"><code>${esc(D.rsvp.email)}</code><button type="button" class="copy copyic" data-copy="${esc(D.rsvp.email)}" aria-label="${U('Copy')} ${esc(D.rsvp.email)}">${COPYIC}<span class="cl">${U('Copy')}</span></button></div>`:''}</div>`;
  const main = open ? `<div class="rsvp"><div class="rsvp-txt"><h2>${T('rsvp.h')}</h2><p>${T('rsvp.b')}</p><p class="rsvp-dl">${T('rsvp.deadline')}</p></div>${btn}</div>` : '';
  const after = D.rsvp.after && (editing || (!open && (!D.rsvp.after.until || d <= D.rsvp.after.until)))
    ? `<div class="rsvp rsvp-after">${editing?'<span class="muted">Shown instead from '+esc(D.rsvp.until)+' until '+esc(D.rsvp.after.until||'')+':</span>':''}<div class="rsvp-txt"><h2>${T('rsvp.after.h')}</h2><p>${T('rsvp.after.b')}</p></div></div>` : '';
  return main || after ? `<section>${main}${after}</section>` : '';
};
V.overview = () => {
  const n = cphNow();
  const start = new Date(D.startDate+'T00:00:00'), today = new Date(n.date+'T00:00:00');
  const days = Math.round((start - today)/864e5);
  const cd = days > 1 ? `<div class="countdown"><b>${days} ${U('days')}</b><span>${U('until')} ${T('countdownLabel')}</span></div>`
           : days === 1 ? `<div class="countdown"><b>${U('Tomorrow')}</b><span>${T('countdownLabel')}</span></div>`
           : (n.date <= D.endDate ? `<div class="countdown"><b>${U('Today')}</b><span>${U('See the')} <a href="#programme">${U('programme')}</a> ${U("for what's on now")}</span></div>` : '');
  return `
  ${editing ? `<div class="edhint">Click any dashed text to change it. Use + to add items and × to remove them. Text in [square brackets] shows as "To confirm" until you replace it. Changes go live for everyone when you press Save changes.</div>` : ''}
  <section>
    <div class="eyebrow">${esc(D.welcomeEyebrow||'Welcome to Copenhagen')}</div>
    <p class="lede">${T('welcome')}</p>
    <p class="muted">${T('welcomeContact')}</p>
  </section>
  ${cd}
  ${rsvp()}
  <section>
    <h2>${U('At a glance')}</h2>
    <div class="grid">${D.glance.map((g,i)=>`<div class="panel fact"><div class="edrow"><span class="k">${T(`glance.${i}.k`)}</span>${DEL(`glance.${i}`)}</div><span class="v">${T(`glance.${i}.v`)}</span><span class="s">${T(`glance.${i}.s`)}</span></div>`).join('')}</div>
    ${ADD('glance','Add a fact')}
  </section>
  <section>
    <h2>${U('Times to remember')}</h2>
    <div class="times">${D.keyTimes.map((k,i)=>`<div class="${k.hot?'hot':''}"><div class="edrow"><span class="d">${T(`keyTimes.${i}.d`)}</span>${DEL(`keyTimes.${i}`)}</div><span class="t">${T(`keyTimes.${i}.t`)}</span><span>${T(`keyTimes.${i}.s`)}</span></div>`).join('')}</div>
    ${ADD('keyTimes','Add a time')}
  </section>`;
};

V.setup = () => `
  <section>
    <div class="eyebrow">Thursday 19 November · Arrivals and set-up</div>
    <div class="dayhead"><h2>Thursday set-up evening</h2><span class="pill hot">Be at the venue <span class="t">18:00</span> sharp</span></div>
    <p>${T('setup.intro')}</p>
  </section>
  <section>
    <h3>Set-up responsibilities</h3>
    ${table('setup.rows')}
    ${editing ? '' : '<p class="muted" style="font-size:14px">Tap a name to see everything that person is responsible for.</p>'}
  </section>
  <section>${notes('setup.notes')}</section>`;

V.programme = () => {
  const n = cphNow();
  if (!selDay) selDay = (D.days.find(d=>d.iso===n.date) || D.days[0]).id;
  const di = D.days.findIndex(d=>d.id===selDay), day = D.days[di], P = `days.${di}`;
  const live = day.iso === n.date && !editing;
  let nowI = -1, nextI = -1;
  if (live) day.sessions.forEach((s,i)=>{
    const st = toMin(s.t), en = day.sessions[i+1] ? toMin(day.sessions[i+1].t) : st+60;
    if (n.mins>=st && n.mins<en) nowI=i;
    if (nextI<0 && st>n.mins) nextI=i;
  });
  const typeLabel = k => k==='soft' ? 'Break' : k==='social' ? 'Social' : 'Talk';
  return `
  <section>
    <div class="days" role="group" aria-label="${U('Choose a day')}">${D.days.map(d=>`<button type="button" id="day-${d.id}" data-day="${d.id}" aria-pressed="${d.id===selDay}">${esc(d.name)}<small>${esc(d.date)}</small></button>`).join('')}</div>
  </section>
  <section>
    <div class="dayhead">
      <div style="display:flex;flex-direction:column;gap:8px"><div class="eyebrow">${T(P+'.eyebrow')}</div><h2>${esc(day.name)} ${esc(day.date)}</h2></div>
      <span class="pill ${day.headline.hot?'hot':''}">${T(P+'.headline.label')} <span class="t">${T(P+'.headline.t')}</span></span>
    </div>
    ${day.callout ? `<div class="rsvp"><div class="rsvp-txt"><h2>${T(P+'.callout.h')}</h2><p>${T(P+'.callout.b')}</p></div></div>` : ''}
    ${day.rsvp ? rsvp().replace(/^<section>|<\/section>$/g,'') : ''}
    <ol class="tt">${day.sessions.map((s,i)=>`
      <li class="${s.k||''} ${i===nowI?'now':''}">
        <span class="time">${T(`${P}.sessions.${i}.t`)}</span>
        <span class="what"><span class="edrow"><span class="title">${T(`${P}.sessions.${i}.title`)}${i===nowI?`<span class="flag now">${U('Now')}</span>`:''}${i===nextI?`<span class="flag next">${U('Next')}</span>`:''}</span>${editing?`<button type="button" class="edtype" data-cycle="${P}.sessions.${i}.k" title="Change type">${typeLabel(s.k)}</button>`:''}${DEL(`${P}.sessions.${i}`)}</span>${(s.who||editing)?`<span class="who">${T(`${P}.sessions.${i}.who`)}</span>`:''}</span>
      </li>`).join('')}</ol>
    ${ADD(P+'.sessions','Add a session')}
    <p class="change">${editing ? 'Sessions are put back in time order when you save. Break and Social rows are shaded.' : tx(D.tzNote||'Times in Copenhagen time (CET). Agenda subject to change.')}</p>
  </section>
  ${day.yourDay?`<section><h3>Your day</h3><div class="times">${day.yourDay.map((y,i)=>`<div><div class="edrow"><span class="d">${T(`${P}.yourDay.${i}.d`)}</span>${DEL(`${P}.yourDay.${i}`)}</div><span class="t" style="font-size:22px;font-weight:500">${T(`${P}.yourDay.${i}.t`)}</span><span>${T(`${P}.yourDay.${i}.s`)}</span></div>`).join('')}</div>${ADD(P+'.yourDay','Add an item')}</section>`:''}
  <section>${notes(P+'.notes')}</section>`;
};

V.speakers = () => {
  const sess = sp => { const out=[]; if(!sp.match) return out;
    D.days.forEach(d => d.sessions.forEach(s => { if ((s.who||'').includes(sp.match)) out.push({d:d.name, t:s.t, title:s.title}); })); return out; };
  return `
  <section>
    <h2>${U('Our speakers')}</h2>
    <p>${D.speakers.length} ${U('speakers across the conference. Each card shows when they are on stage.')}</p>
    <div class="speakers">${D.speakers.map((sp,i)=>{ const ss=sess(sp); const img=PHOTOS[sp.key];
      return `<article class="panel speaker" id="sp-${esc(sp.key||i)}">
        <div class="sp-head">${img?`<img class="sp-photo" src="${img}" alt="${esc(sp.name)}">`:`<span class="sp-photo sp-initial">${esc((sp.name||'?').replace(/^Dr\\s+/,'')[0])}</span>`}
          <div class="sp-id"><h3>${T(`speakers.${i}.name`)}</h3>${(sp.creds||editing)?`<span class="sp-creds">${T(`speakers.${i}.creds`)}</span>`:''}<span class="sp-role">${T(`speakers.${i}.role`)}</span></div>${DEL(`speakers.${i}`)}</div>
        <p>${T(`speakers.${i}.bio`)}</p>
        ${ss.length?`<ul class="sp-sess">${ss.map(x=>`<li><span class="sp-when">${esc(x.d.slice(0,3))} ${esc(x.t)}</span><span>${tx(x.title)}</span></li>`).join('')}</ul>`:''}
      </article>`;}).join('')}</div>
    ${ADD('speakers','Add a speaker')}
  </section>`;
};

V.travel = () => {
  const T0 = D.travel;
  return `
  <section>
    <h2>${U('Getting there')}</h2>
    <p>${T('travel.intro')}</p>
    <div class="journey">${T0.journey.map((j,i)=> j.leg
      ? `<div class="leg"><i>→</i>${T(`travel.journey.${i}.leg`)}<br><span>${T(`travel.journey.${i}.s`)}</span></div>`
      : `<div class="stop"><b>${T(`travel.journey.${i}.b`)}</b><span>${T(`travel.journey.${i}.s`)}</span></div>`).join('')}</div>
  </section>
  ${MAPF().trim()?`<section>
    <h3>${U('Around the venue')}</h3>
    <div class="map">${MAPF()}
      <div class="mapfoot"><span class="muted">${U('Simplified map. Walking times at an easy pace.')}</span>
        ${T0.mapLinks.map(m=>`<a class="btnlink" href="${gmaps(m.q)}" target="_blank" rel="noopener">${esc(m.label)} ${U('in Google Maps ↗')}</a>`).join('')}</div>
    </div>
  </section>`:''}
  <section>
    <div class="grid">
      <div class="panel"><h3>${U('From the airport')}</h3><ol class="steps">${T0.from.map((_,i)=>`<li><span class="edrow"><span>${T(`travel.from.${i}`)}</span>${DEL(`travel.from.${i}`)}</span></li>`).join('')}</ol>${ADD('travel.from','Add a step')}</div>
      <div class="panel"><h3>${U('Going home')}</h3><ol class="steps">${T0.home.map((_,i)=>`<li><span class="edrow"><span>${T(`travel.home.${i}`)}</span>${DEL(`travel.home.${i}`)}</span></li>`).join('')}</ol>${ADD('travel.home','Add a step')}</div>
    </div>
  </section>
  <section>
    <h2>${T('travel.hotelsTitle')}</h2>
    <div class="grid">${T0.hotels.map((h,i)=>`<div class="panel hotel"><div class="edrow"><span class="who">${T(`travel.hotels.${i}.who`)}</span>${DEL(`travel.hotels.${i}`)}</div><h3>${T(`travel.hotels.${i}.name`)}</h3><p>${T(`travel.hotels.${i}.addr`)}</p><p class="muted">${T(`travel.hotels.${i}.s`)}</p>${editing?'':`<a class="btnlink" href="${gmaps(h.q || (h.name+', '+h.addr))}" target="_blank" rel="noopener">${U('Open in Google Maps ↗')}</a>`}</div>`).join('')}</div>
    ${ADD('travel.hotels','Add a hotel')}
    ${T0.hotelNote!=null?`<p>${T('travel.hotelNote')}</p>`:''}
  </section>`;
};

V.roles = () => `
  <section>
    <div class="eyebrow">Friday to Sunday</div>
    <h2>Your role, every day</h2>
    <p>${T('roles.intro')}</p>
    ${table('roles.rows')}
  </section>
  <section>
    <h3>What we expect from everyone</h3>
    ${notes('roles.expect','Add an expectation')}
  </section>`;

V.team = () => {
  const people = {};
  const add = (rows, when) => rows.forEach(r => String(r.who).split('/').map(s=>s.trim()).filter(Boolean).forEach(p => {
    if (p==='Anyone') return;
    (people[p] ||= []).push({what:r.what, where:r.where, when});
  }));
  add(D.setup.rows,'Thursday set-up'); add(D.roles.rows,'Fri–Sun');
  const leads = D.leads || {};
  const names = Object.keys(people).sort((a,b)=>(leads[b]?1:0)-(leads[a]?1:0) || a.localeCompare(b));
  return `
  <section>
    <h2>Staff attending</h2>
    <p>Everyone on the team and what they look after. Built from the set-up and daily role tables, so it stays in step with them.${editing?' To change it, edit the names in those tables.':''}</p>
    <div class="people">${names.map(p=>`
      <div class="panel person ${selPerson===p?'sel':''}" id="p-${esc(p)}">
        <header><span class="avatar">${esc(p[0])}</span><div><h3>${esc(leads[p]?.full||p)}</h3><span class="muted" style="font-size:14px">${esc(leads[p]?.role || people[p].length+(people[p].length===1?' responsibility':' responsibilities'))}</span></div></header>
        <ul>${people[p].map(r=>`<li class="${r.when.startsWith('Thu')?'thu':''}">${esc(r.what)}<span>${esc(r.where)} · ${esc(r.when)}</span></li>`).join('')}</ul>
      </div>`).join('')}</div>
    <p class="muted" style="font-size:14px">Dark blue marker: Thursday set-up only. Light blue marker: daily role, Friday to Sunday. Bell ringer at the end of each break is anyone's job.</p>
  </section>`;
};

V.practical = () => `
  <section>

    <p>${T('practicalIntro')}</p>
    ${notes('practical','Add a topic')}
  </section>`;

V.resources = () => {
  const R = D.resources, base = R.base || '';
  const mb = b => b >= 1e6 ? (b/1e6).toFixed(1).replace('.', lang==='de'?',':'.') + ' MB' : Math.max(1, Math.round(b/1e3)) + ' KB';
  return `
  <section>
    <h2>${T('resources.title')}</h2>
    <p>${T('resources.intro')}</p>
    ${R.cloud ? `<div class="rsvp" style="margin-top:16px"><div class="rsvp-txt"><h2>${T('resources.cloud.h')}</h2><p>${T('resources.cloud.b')}</p></div>${editing ? `<span class="rsvp-btn">${T('resources.cloud.btn')}</span><span class="muted">Link: ${T('resources.cloud.href')}</span>` : `<a class="rsvp-btn" href="${esc(R.cloud.href)}" target="_blank" rel="noopener">${esc(R.cloud.btn)} ↗</a>`}</div>` : ''}
  </section>
  ${R.groups.map((g,gi)=>`<section>
    <h3 class="res-h">${T(`resources.groups.${gi}.h`)}</h3>
    ${g.s?`<p class="muted">${T(`resources.groups.${gi}.s`)}</p>`:''}
    ${g.items && g.items.length ? `<ul class="res">${g.items.map((it,ii)=>`<li>${editing?'<div class="resrow">':`<a href="${esc(base+it.file)}" download target="_blank" rel="noopener">`}<span class="res-ic" aria-hidden="true">PDF</span><span class="res-n">${editing?T(`resources.groups.${gi}.items.${ii}.name`):esc(it.name)}<small>${esc(it.meta||'')}${it.meta?' · ':''}${mb(it.bytes)}</small></span><span class="res-dl">${U('Download')} ↓</span>${editing?'</div>':'</a>'}</li>`).join('')}</ul>`
      : `<p class="res-empty">${T(`resources.groups.${gi}.empty`)}</p>`}
  </section>`).join('')}`;
};

V.contacts = () => `
  <section>
    <div class="sos"><b>112</b><div><h3>${U('Emergency: police, fire, ambulance')}</h3><p>${tx(D.sosNote||'Free from any phone in Denmark.')}${D.kind==='staff'?' Then call Oliver or Suzy.':''}</p></div></div>
  </section>
  <section>
    <h2>${U('Contacts')}</h2>
    <div class="grid">${D.contacts.map((c,i)=>`<div class="panel contact"><div class="edrow"><h3>${T(`contacts.${i}.name`)}</h3>${DEL(`contacts.${i}`)}</div><span class="role">${T(`contacts.${i}.role`)}</span>
      ${(c.lines||[]).map((l,j)=>`<div class="line"><code>${T(`contacts.${i}.lines.${j}`)}</code>${editing?DEL(`contacts.${i}.lines.${j}`):`<button type="button" class="copy copyic" data-copy="${esc(l)}" aria-label="${U('Copy')} ${esc(l)}">${COPYIC}<span class="cl">${U('Copy')}</span></button>`}</div>`).join('')}
      ${ADD(`contacts.${i}.lines`,'Add a number or email')}
      ${c.web&&!editing?`<a class="btnlink" href="https://${esc(c.web)}" target="_blank" rel="noopener">${esc(c.web)} ↗</a>`:''}</div>`).join('')}</div>
    ${ADD('contacts','Add a contact')}
  </section>
  ${D.social!=null?`<section><h3>${U('Share the conference')}</h3><p>${T('social')}</p></section>`:''}`;

function table(p){
  const rows = get(p);
  return `<div class="tablebox"><table><thead><tr><th>What</th><th>Where</th><th>Who</th></tr></thead><tbody>${
    rows.map((r,i)=>`<tr><td>${T(`${p}.${i}.what`)}</td><td>${T(`${p}.${i}.where`)}</td><td class="whom">${editing
      ? `<span class="edrow">${T(`${p}.${i}.who`)}${DEL(`${p}.${i}`)}</span>`
      : String(r.who).split('/').map(x=>x.trim()).map(x=>x==='Anyone'?'<span class="muted">Anyone</span>':`<button type="button" class="chip" data-person="${esc(x)}">${esc(x)}</button>`).join('')}</td></tr>`).join('')
  }</tbody></table></div>${ADD(p,'Add a row')}${editing?'<p class="muted" style="font-size:14px">Separate names with a slash, for example: Anabel / Grace</p>':''}`;
}

// ---------- Edit bar ----------
const bar = document.getElementById('editbar'), barMsg = document.getElementById('editmsg');
const saveBtn = document.getElementById('edsave'), cancelBtn = document.getElementById('edcancel');
let barNote = '';
function updateBar(){
  bar.hidden = !editing;
  barMsg.textContent = barNote || (dirty ? 'You have unsaved changes.' : 'Editing. Nothing changed yet.');
  saveBtn.disabled = !dirty;
}
function markDirty(){ if (!dirty){ dirty = true; barNote=''; updateBar(); } }

document.addEventListener('input', e => {
  const el = e.target.closest && e.target.closest('[data-path]');
  if (!el) return;
  setP(el.dataset.path, el.textContent.replace(/ /g,' '));
  markDirty();
});
document.addEventListener('keydown', e => {
  const el = e.target.closest && e.target.closest('.ed');
  if (el && e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); el.blur(); }
});

document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb){ if (editing && dirty) return; lang = lb.dataset.lang; D = ALL[lang]; try { sessionStorage.setItem('hb-lang', lang); } catch(_) {} selDay = null; render(); return; }
  if (e.target.closest('#eddl')){ downloadHTML(); return; }
  if (e.target.closest('#edstart')){ editing = true; dirty = false; barNote=''; render(); return; }
  const add = e.target.closest('[data-add]');
  if (add){ const p = add.dataset.add, key = p.split('.').pop(); const list = get(p); list.push(JSON.parse(JSON.stringify(NEW[key] ?? 'New item'))); markDirty(); render(); return; }
  const del = e.target.closest('[data-del]');
  if (del){ const ks = del.dataset.del.split('.'); const i = +ks.pop(); get(ks.join('.')).splice(i,1); markDirty(); render(); return; }
  const cyc = e.target.closest('[data-cycle]');
  if (cyc){ const p = cyc.dataset.cycle, cur = get(p); const nxt = !cur ? 'soft' : cur==='soft' ? 'social' : undefined; setP(p, nxt); markDirty(); render(); return; }
  const d = e.target.closest('[data-day]');
  if (d){ selDay = d.dataset.day; render(); return; }
  const p = e.target.closest('[data-person]');
  if (p){ selPerson = p.dataset.person; if (location.hash==='#team') render(); else location.hash='team'; return; }
  const c = e.target.closest('[data-copy]');
  if (c){
    const t = c.querySelector('.cl') || c; const done = () => { t.textContent=U('Copied'); setTimeout(()=>t.textContent=U('Copy'),1500); };
    try { navigator.clipboard.writeText(c.dataset.copy).then(done, ()=>selectText(c)); } catch(_) { selectText(c); }
  }
});
function selectText(btn){ const code = btn.previousElementSibling; const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

cancelBtn.addEventListener('click', () => { ALL = JSON.parse(ORIG); D = LANGS ? ALL[lang] : ALL; editing = false; dirty = false; barNote=''; render(); });
saveBtn.addEventListener('click', async () => {
  if (!artifactNS) return;
  (LANGS ? LANGS.map(l=>ALL[l]) : [D]).forEach(x => x.days.forEach(d => d.sessions.sort((a,b) => toMin(a.t) - toMin(b.t))));
  saveBtn.disabled = cancelBtn.disabled = true; barNote = 'Saving…'; barMsg.textContent = barNote;
  try {
    await artifactNS.publish(buildDoc());
    barNote = 'Saved. Reloading with your changes…'; barMsg.textContent = barNote;
  } catch (err) {
    cancelBtn.disabled = false;
    const code = err && err.code;
    if (code === 'conflict') barNote = 'Someone else saved a newer version first, so the page is reloading with theirs. Please make your change again.';
    else if (code === 'not_writer' || code === 'not_granted'){ barNote = 'You can view this handbook but not edit it. Ask the owner for edit access.'; canEditPage = false; }
    else barNote = 'Your changes were not saved. Check your connection and press Save changes again.';
    barMsg.textContent = barNote; saveBtn.disabled = code === 'not_writer' || code === 'not_granted';
  }
});

async function downloadHTML(){
  const msg = document.getElementById('dlmsg');
  const name = D.fileName || (D.kind === 'staff' ? 'nordic-staff.html' : 'nordic-delegate.html');
  try { await downloadsNS.save({filename: name, data: buildDoc()}); msg.textContent = 'Saved ' + name + '. Upload it to replace the file on your website.'; }
  catch (err) {
    const code = err && err.code;
    msg.textContent = code === 'declined' ? '' : code === 'rate_limited' ? 'A save is already open. Finish that one first.' : 'Downloads are not available here.';
  }
}

// The whole page, rebuilt from the current data, in the shape the Artifact tool publishes
function buildDoc(){
  const SC = '<' + '/script>';
  const json = JSON.stringify(LANGS ? ALL : D).replace(/</g, '\\u003c');
  const head = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  return head + '\n<title>' + esc(document.title) + '</title>\n'
    + '<meta name="claude:viewport-fit-sides" content="cover">\n<meta name="google" content="notranslate">\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;500;700&family=Open+Sans:wght@400;700&display=swap">\n'
    + '<style id="hb-style">' + document.getElementById('hb-style').textContent + '</style>\n\n'
    + '<header class="band" id="band"></header>\n'
    + '<nav class="tabs" aria-label="Sections"><div class="wrap rail" id="tabs"></div></nav>\n'
    + '<main><div class="wrap" id="view"></div></main>\n'
    + '<div class="editbar" id="editbar" hidden><div class="wrap"><span class="msg" id="editmsg"></span><button type="button" id="edcancel">Cancel</button><button type="button" class="primary" id="edsave">Save changes</button></div></div>\n\n'
    + '<script type="application/json" id="hb-data">' + json + SC + '\n'
    + '<script id="hb-app">' + APP_SRC + SC + '\n</body></html>';
}

addEventListener('hashchange', () => { render(); scrollTo(0,0); });
addEventListener('beforeunload', e => { if (editing && dirty) { e.preventDefault(); e.returnValue = ''; } });
render();
setInterval(()=>{ if(!editing && (location.hash||'#'+tabs[0].id)==='#programme') render(); }, 60000);

// Light up editing for people who can edit this page
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const [a, u, dl] = await Promise.all([claude.use('artifact'), claude.use('user'), claude.use('downloads')]);
    if (!a) return;
    artifactNS = a; downloadsNS = dl;
    canEditPage = u ? await u.canEdit() : false;
    if (canEditPage && !editing) renderBand();
  } catch (_) {}
})();
</script>
